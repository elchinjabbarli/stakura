<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Stakura — Serene Tower Stacking</title>
  <meta name="description" content="Stakura — a serene 3D tower-stacking arcade. One tap, infinite procedural biomes, perfect-drop combos. Runs offline.">
  <meta name="theme-color" content="#1c1216">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stakura">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Stakura — Serene Tower Stacking">
  <meta property="og:description" content="One tap. Infinite towers. Stack calm, stack high.">
  <meta property="og:image" content="https://elchinjabbarli.github.io/stakura/og.png">
  <meta property="og:url" content="https://elchinjabbarli.github.io/stakura/">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Stakura 1.0.0 — built 2026-10-29 -->
  <style>
    html, body { margin: 0; height: 100%; background: #1c1216; overflow: hidden; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; }
    #splash { position: fixed; inset: 0; z-index: 50; background: #1c1216; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .6s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    .sp-tower { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .sp-tower i { display: block; border-radius: 5px; background: linear-gradient(180deg, #ef92ac, #f2a25c); animation: sp-breathe 1.6s cubic-bezier(.21,.88,.28,1.18) infinite; }
    .sp-tower i:nth-child(1) { width: 18px; height: 14px; }
    .sp-tower i:nth-child(2) { width: 30px; height: 14px; animation-delay: .12s; }
    .sp-tower i:nth-child(3) { width: 42px; height: 14px; animation-delay: .24s; }
    .sp-tower i:nth-child(4) { width: 56px; height: 14px; animation-delay: .36s; }
    .sp-tower i:nth-child(5) { width: 72px; height: 14px; animation-delay: .48s; }
    @keyframes sp-breathe { 0%,100% { transform: scaleX(1); opacity: .75; } 50% { transform: scaleX(1.08); opacity: 1; } }
    .sp-word { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .5em; text-indent: .5em; color: rgba(247,236,231,.38); }
  </style>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="sp-tower"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sp-word">STAKURA</div>
  </div>
  <div id="app" role="application" aria-label="Stakura game"></div>
  <script src="./assets/bundle.js" defer></script>
</body>
</html>
